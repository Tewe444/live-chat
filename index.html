<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Collab - Echtzeit Kollaboration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 flex flex-col">

    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-bolt-lightning text-xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg tracking-tight text-white">LiveSync Text</h1>
                <p class="text-xs text-slate-400">Echtzeit-Textkollaboration für mehrere Geräte</p>
            </div>
        </div>
        <div id="connectionStatus" class="flex items-center space-x-2 px-3 py-1.5 rounded-full bg-slate-800 text-xs text-slate-300 border border-slate-700">
            <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse" id="statusDot"></span>
            <span id="statusText">Verbinde...</span>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 sm:p-6 flex flex-col">

        <!-- Room selection card -->
        <div id="roomSelectionView" class="my-auto max-w-md mx-auto w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
            <div class="text-center mb-6">
                <div class="inline-flex p-3 rounded-full bg-indigo-500/10 text-indigo-400 mb-3 border border-indigo-500/20">
                    <i class="fa-solid fa-users-viewfinder text-2xl"></i>
                </div>
                <h2 class="text-xl font-bold text-white">Raum beitreten oder erstellen</h2>
                <p class="text-sm text-slate-400 mt-1">Schreibe auf einem Gerät und sehe die Änderungen sofort auf allen anderen Geräten.</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Dein Name / Gerät</label>
                    <input type="text" id="usernameInput" placeholder="z. B. Laptop, Handy..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm">
                </div>

                <div class="flex space-x-2">
                    <input type="text" id="customRoomCodeInput" placeholder="Eigener Raum-Code (optional)..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm uppercase">
                    <button onclick="createRoom()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition shadow-lg shadow-indigo-600/20 flex items-center justify-center space-x-2 whitespace-nowrap cursor-pointer">
                        <i class="fa-solid fa-plus-circle"></i>
                        <span>Erstellen</span>
                    </button>
                </div>

                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-slate-500 text-xs uppercase tracking-wider">Oder beitreten</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <div class="flex space-x-2">
                    <input type="text" id="roomCodeInput" placeholder="Raum-ID eingeben..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition text-sm uppercase">
                    <button onclick="joinRoom()" class="bg-slate-800 hover:bg-slate-700 text-white font-medium px-5 py-3 rounded-xl transition border border-slate-700 cursor-pointer">
                        Beitreten
                    </button>
                </div>
            </div>
        </div>

        <!-- Collaborative Editor View -->
        <div id="editorView" class="hidden flex-1 flex flex-col space-y-4">
            
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center space-x-3 w-full sm:w-auto">
                    <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 flex items-center space-x-2">
                        <span class="text-xs text-slate-400">Raum:</span>
                        <span id="currentRoomIdDisplay" class="font-mono font-bold text-indigo-400 select-all">---</span>
                    </div>
                    <button onclick="copyShareLink()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-xl text-xs transition border border-slate-700 flex items-center space-x-1.5 cursor-pointer">
                        <i class="fa-solid fa-share-nodes"></i>
                        <span>Link teilen</span>
                    </button>
                </div>

                <div class="flex items-center justify-between w-full sm:w-auto space-x-4">
                    <div id="activeUsersList" class="flex items-center space-x-1 text-xs text-slate-400"></div>
                    <button onclick="leaveRoom()" class="text-rose-400 hover:text-rose-300 text-xs font-medium px-3 py-1.5 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 transition cursor-pointer">
                        Raum verlassen
                    </button>
                </div>
            </div>

            <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl flex flex-col overflow-hidden shadow-xl">
                <div class="bg-slate-950/50 px-4 py-2 border-b border-slate-800 flex items-center justify-between text-xs text-slate-400">
                    <div class="flex items-center space-x-2">
                        <i class="fa-solid fa-file-pen text-indigo-400"></i>
                        <span>Live-Notizblock (dauerhaft gespeichert)</span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span id="wordCount">0 Wörter</span>
                        <span id="charCount">0 Zeichen</span>
                    </div>
                </div>
                <textarea id="liveTextarea" placeholder="Beginne hier zu tippen..." class="flex-1 w-full bg-transparent p-4 sm:p-6 text-slate-100 placeholder-slate-600 focus:outline-none resize-none text-base leading-relaxed font-sans"></textarea>
            </div>

        </div>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 transform translate-y-24 opacity-0 transition-all duration-300 bg-slate-800 text-white px-4 py-3 rounded-xl border border-slate-700 shadow-2xl flex items-center space-x-3 text-sm z-50">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMessage">Aktion erfolgreich</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'live-text-collab-v1';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');

        let app, db, auth;
        let currentRoomId = null;
        let currentUser = null;
        let unsubscribeDoc = null;
        let isRemoteUpdate = false;
        let typingTimeout = null;

        try {
            app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initAuth = async () => {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                currentUser = auth.currentUser;
                updateConnectionStatus(true);
            };
            initAuth();
        } catch (e) {
            console.error("Firebase Init Error:", e);
            updateConnectionStatus(false, "Offline / Demo-Modus");
        }

        function updateConnectionStatus(online, text = "Online (Live)") {
            const dot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            if (online) {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
                statusText.innerText = text;
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
                statusText.innerText = text;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const roomParam = params.get('room');
            if (roomParam) {
                document.getElementById('roomCodeInput').value = roomParam;
            }
        });

        window.createRoom = async () => {
            const username = document.getElementById('usernameInput').value.trim() || 'Gast-' + Math.floor(Math.random() * 1000);
            let roomId = document.getElementById('customRoomCodeInput').value.trim().toUpperCase();
            
            if (!roomId) {
                roomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            }

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${roomId}`);
                const docSnap = await getDoc(roomRef);

                if (docSnap.exists()) {
                    showToast("Raum gibt es schon", "error");
                    return;
                }
            } catch (e) {
                console.error("Fehler beim Prüfen:", e);
            }

            localStorage.setItem('live_text_username', username);
            await enterRoom(roomId, username, true);
        };

        window.joinRoom = async () => {
            const username = document.getElementById('usernameInput').value.trim() || 'Gast-' + Math.floor(Math.random() * 1000);
            const roomId = document.getElementById('roomCodeInput').value.trim().toUpperCase();

            if (!roomId) {
                showToast("Bitte gib eine gültige Raum-ID ein!", "error");
                return;
            }

            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${roomId}`);
                const docSnap = await getDoc(roomRef);

                if (!docSnap.exists()) {
                    showToast("Raum gibt es nicht", "error");
                    return;
                }
            } catch (e) {
                console.error("Fehler beim Prüfen:", e);
                showToast("Raum gibt es nicht", "error");
                return;
            }

            localStorage.setItem('live_text_username', username);
            await enterRoom(roomId, username, false);
        };

        async function enterRoom(roomId, username, isNew) {
            currentRoomId = roomId;
            
            try {
                const newUrl = `${window.location.pathname}?room=${roomId}`;
                window.history.replaceState({ path: newUrl }, '', newUrl);
            } catch (e) {}

            document.getElementById('roomSelectionView').classList.add('hidden');
            document.getElementById('editorView').classList.remove('hidden');
            document.getElementById('currentRoomIdDisplay').innerText = roomId;

            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${roomId}`);
            const userId = currentUser?.uid || 'anon_' + Math.random();
            
            try {
                const docSnap = await getDoc(roomRef);
                if (!docSnap.exists() || isNew) {
                    await setDoc(roomRef, {
                        content: "Willkommen im Live-Raum!\n\nAlles wird dauerhaft gespeichert.",
                        updatedAt: Date.now(),
                        users: { [userId]: { name: username, lastActive: Date.now() } }
                    });
                } else {
                    const data = docSnap.data();
                    const users = data.users || {};
                    users[userId] = { name: username, lastActive: Date.now() };
                    await updateDoc(roomRef, { users, updatedAt: Date.now() });
                }
            } catch (e) {
                console.error("Error setting up room:", e);
            }

            unsubscribeDoc = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const textarea = document.getElementById('liveTextarea');
                    
                    if (data.content !== undefined && data.content !== textarea.value) {
                        isRemoteUpdate = true;
                        const cursorStart = textarea.selectionStart;
                        const cursorEnd = textarea.selectionEnd;
                        
                        textarea.value = data.content;
                        updateStats(data.content);

                        try {
                            textarea.setSelectionRange(cursorStart, cursorEnd);
                        } catch(err) {}
                        isRemoteUpdate = false;
                    }

                    renderActiveUsers(data.users || {});
                }
            });
        }

        const textarea = document.getElementById('liveTextarea');
        textarea.addEventListener('input', (e) => {
            if (isRemoteUpdate || !currentRoomId) return;

            const content = e.target.value;
            updateStats(content);

            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(async () => {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}`);
                    await updateDoc(roomRef, {
                        content: content,
                        updatedAt: Date.now()
                    });
                } catch (err) {}
            }, 100);
        });

        function updateStats(text) {
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            const chars = text.length;
            document.getElementById('wordCount').innerText = `${words} Wörter`;
            document.getElementById('charCount').innerText = `${chars} Zeichen`;
        }

        function renderActiveUsers(usersObj) {
            const container = document.getElementById('activeUsersList');
            container.innerHTML = '';
            
            const users = Object.values(usersObj);
            users.forEach(user => {
                const badge = document.createElement('div');
                badge.className = "bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg text-slate-300 flex items-center space-x-1.5";
                badge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>${user.name}</span>`;
                container.appendChild(badge);
            });
        }

        window.copyShareLink = () => {
            const shareUrl = window.location.href;
            const tempInput = document.createElement('input');
            tempInput.value = shareUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand('copy');
            document.body.removeChild(tempInput);
            showToast("Teilen-Link in die Zwischenablage kopiert!");
        };

        window.leaveRoom = async () => {
            if (currentRoomId && currentUser) {
                try {
                    const roomRef = doc(db, 'artifacts', appId, 'public', 'data', `room_${currentRoomId}`);
                    await updateDoc(roomRef, {
                        [`users.${currentUser.uid}`]: deleteField(),
                        updatedAt: Date.now()
                    });
                } catch (e) {}
            }

            if (unsubscribeDoc) unsubscribeDoc();
            currentRoomId = now = null;
            
            try {
                const cleanUrl = window.location.pathname;
                window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
            } catch (e) {}

            document.getElementById('editorView').classList.add('hidden');
            document.getElementById('roomSelectionView').classList.remove('hidden');
            showToast("Raum verlassen");
        };

        function showToast(message, type = "success") {
            const toast = document.getElementById('toast');
            const msg = document.getElementById('toastMessage');
            const icon = document.getElementById('toastIcon');

            msg.innerText = message;
            if (type === "error") {
                icon.className = "fa-solid fa-circle-exclamation text-rose-400";
            } else {
                icon.className = "fa-solid fa-circle-check text-emerald-400";
            }

            toast.classList.remove('translate-y-24', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3000);
        }

        window.addEventListener('load', () => {
            const savedName = localStorage.getItem('live_text_username');
            if (savedName) {
                document.getElementById('usernameInput').value = savedName;
            }
        });
    </script>
</body>
</html>
