<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Text Collab - Echtzeit Kollaboration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <!-- Status Bar -->
    <header class="bg-white border-b border-slate-200 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-lg flex items-center justify-center shadow-md">
                <i class="fa-solid fa-feather-pointed text-lg"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 leading-tight">LiveText Collab</h1>
                <p class="text-xs text-slate-500">Echtzeit-Texteditor</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <div id="connection-status" class="flex items-center space-x-2 px-3 py-1 bg-amber-50 border border-amber-200 rounded-full text-xs font-medium text-amber-700">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                <span id="status-text">Verbinde mit Cloud...</span>
            </div>
            <div id="user-badge" class="hidden items-center space-x-2 bg-slate-100 px-3 py-1 rounded-full text-xs font-medium text-slate-600 border border-slate-200">
                <i class="fa-solid fa-user text-indigo-500"></i>
                <span id="display-username">Gast</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex overflow-hidden relative">
        
        <!-- View 1: Raum-Auswahl (Lobby) -->
        <div id="lobby-view" class="absolute inset-0 bg-slate-50 flex items-center justify-center p-4 z-10 overflow-y-auto">
            <div class="bg-white rounded-2xl shadow-xl border border-slate-200 max-w-md w-full p-8 space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-2xl mx-auto flex items-center justify-center text-2xl shadow-inner">
                        <i class="fa-solid fa-comments"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-slate-900">Gemeinsam Schreiben</h2>
                    <p class="text-sm text-slate-500">Erstelle einen neuen Raum oder trete einem bestehenden Raum bei.</p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1">Dein Name (optional)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-user-pen"></i>
                            </span>
                            <input type="text" id="username-input" placeholder="Zufälliger Name falls leer..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
                        </div>
                    </div>

                    <hr class="border-slate-100 my-2">

                    <!-- Raum erstellen -->
                    <div class="space-y-2">
                        <button id="create-room-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-xl transition-all shadow-md shadow-indigo-100 flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-plus"></i>
                            <span>Neuen Raum erstellen</span>
                        </button>
                    </div>

                    <div class="relative flex py-2 items-center">
                        <div class="flex-grow border-t border-slate-200"></div>
                        <span class="flex-shrink mx-4 text-xs uppercase tracking-widest text-slate-400 font-semibold">oder beitreten</span>
                        <div class="flex-grow border-t border-slate-200"></div>
                    </div>

                    <!-- Raum beitreten -->
                    <div class="space-y-2">
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fa-solid fa-key"></i>
                            </span>
                            <input type="text" id="room-id-input" placeholder="Raum-Code eingeben..." class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all uppercase">
                        </div>
                        <button id="join-room-btn" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 px-4 rounded-xl transition-all shadow-md flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-arrow-right-to-bracket"></i>
                            <span>Raum betreten</span>
                        </button>
                    </div>
                </div>

                <div id="lobby-error" class="hidden p-3 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-xl text-center"></div>
            </div>
        </div>

        <!-- View 2: Editor (Hauptansicht) -->
        <div id="editor-view" class="hidden flex-1 flex flex-col md:flex-row h-full w-full overflow-hidden">
            
            <!-- Linke Spalte: Editor & Toolbar -->
            <div class="flex-1 flex flex-col h-full overflow-hidden bg-white border-r border-slate-200">
                <!-- Editor Header / Toolbar -->
                <div class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0">
                    <div class="flex items-center space-x-3">
                        <button id="leave-room-btn" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-medium rounded-lg transition-all flex items-center space-x-1.5 border border-slate-300">
                            <i class="fa-solid fa-arrow-left"></i>
                            <span>Verlassen</span>
                        </button>
                        <div class="h-4 w-px bg-slate-200"></div>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-slate-400 font-medium uppercase">Raum:</span>
                            <span id="current-room-badge" class="font-mono text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-md border border-indigo-100 select-all">---</span>
                            <button id="copy-room-btn" class="text-slate-400 hover:text-indigo-600 p-1 text-xs transition-colors" title="Raum-Code kopieren">
                                <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button id="clear-text-btn" class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-700 text-xs font-medium rounded-lg transition-all flex items-center space-x-1 border border-rose-200">
                            <i class="fa-solid fa-trash-can"></i>
                            <span>Leeren</span>
                        </button>
                        <button id="export-txt-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium rounded-lg transition-all flex items-center space-x-1 shadow-sm">
                            <i class="fa-solid fa-download"></i>
                            <span>Speichern</span>
                        </button>
                    </div>
                </div>

                <!-- Textarea -->
                <div class="flex-1 p-4 bg-slate-50/50 flex flex-col overflow-hidden">
                    <textarea id="main-editor" class="flex-1 w-full p-4 bg-white border border-slate-200 rounded-xl shadow-inner resize-none focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent text-slate-700 text-base leading-relaxed custom-scrollbar" placeholder="Beginne hier zu schreiben... Deine Änderungen werden in Echtzeit synchronisiert."></textarea>
                </div>
            </div>

            <!-- Rechte Spalte: Aktive Nutzer & Info -->
            <div class="w-full md:w-72 bg-slate-50 border-t md:border-t-0 md:border-l border-slate-200 flex flex-col shrink-0 h-48 md:h-full">
                <div class="p-4 border-b border-slate-200 bg-white flex items-center justify-between shrink-0">
                    <h3 class="font-semibold text-xs text-slate-600 uppercase tracking-wider flex items-center space-x-2">
                        <i class="fa-solid fa-users text-indigo-500"></i>
                        <span>Anwesend im Raum</span>
                    </h3>
                    <span id="active-users-count" class="bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-0.5 rounded-full">1</span>
                </div>
                
                <div class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar" id="active-users-list">
                    <!-- Wird dynamisch gefüllt -->
                </div>

                <div class="p-3 bg-white border-t border-slate-200 text-center text-xs text-slate-400 shrink-0">
                    Sicherer Cloud-Sync aktiv
                </div>
            </div>

        </div>
    </main>

    <!-- Firebase SDKs via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // DEINE ECHTEN FIREBASE DATEN HIER EINGETRAGEN
        // ==========================================
        const fallbackConfig = {
            apiKey: "AIzaSyATCaZy2CJ7Ig3Eed841bo30ZRPH0kVtVM",
            authDomain: "livetextapp-d5fb8.firebaseapp.com",
            projectId: "livetextapp-d5fb8",
            storageBucket: "livetextapp-d5fb8.firebasestorage.app",
            messagingSenderId: "968443356315",
            appId: "1:968443356315:web:ad21cd26d2ddd5d078923e"
        };

        let app;
        let db;
        let isOnline = false;

        // Verbindung zu Firebase initialisieren
        try {
            app = initializeApp(fallbackConfig);
            db = getFirestore(app);
            isOnline = true;
            updateConnectionStatus(true);
        } catch (e) {
            console.error("Firebase Initialisierungsfehler:", e);
            updateConnectionStatus(false);
        }

        function updateConnectionStatus(online) {
            const statusEl = document.getElementById('connection-status');
            const textEl = document.getElementById('status-text');
            if (online) {
                statusEl.className = "flex items-center space-x-2 px-3 py-1 bg-emerald-50 border border-emerald-200 rounded-full text-xs font-medium text-emerald-700";
                statusEl.querySelector('span').className = "w-2 h-2 rounded-full bg-emerald-500";
                textEl.textContent = "Online (Live)";
            } else {
                statusEl.className = "flex items-center space-x-2 px-3 py-1 bg-rose-50 border border-rose-200 rounded-full text-xs font-medium text-rose-700";
                statusEl.querySelector('span').className = "w-2 h-2 rounded-full bg-rose-500";
                textEl.textContent = "Offline / Fehler";
            }
        }

        // App State
        let currentRoomId = null;
        let currentUser = {
            id: 'user_' + Math.random().toString(36).substring(2, 9),
            name: 'Gast-' + Math.floor(Math.random() * 9000 + 1000)
        };
        let textUnsubscribe = null;
        let presenceUnsubscribe = null;
        let localChange = false;

        // UI Elemente
        const lobbyView = document.getElementById('lobby-view');
        const editorView = document.getElementById('editor-view');
        const usernameInput = document.getElementById('username-input');
        const roomIdInput = document.getElementById('room-id-input');
        const createRoomBtn = document.getElementById('create-room-btn');
        const joinRoomBtn = document.getElementById('join-room-btn');
        const lobbyError = document.getElementById('lobby-error');
        const mainEditor = document.getElementById('main-editor');
        const currentRoomBadge = document.getElementById('current-room-badge');
        const leaveRoomBtn = document.getElementById('leave-room-btn');
        const clearTextBtn = document.getElementById('clear-text-btn');
        const exportTxtBtn = document.getElementById('export-txt-btn');
        const copyRoomBtn = document.getElementById('copy-room-btn');
        const userBadge = document.getElementById('user-badge');
        const displayUsername = document.getElementById('display-username');
        const activeUsersList = document.getElementById('active-users-list');
        const activeUsersCount = document.getElementById('active-users-count');

        function showError(msg) {
            lobbyError.textContent = msg;
            lobbyError.classList.remove('hidden');
            setTimeout(() => lobbyError.classList.add('hidden'), 4000);
        }

        function setupUser() {
            const enteredName = usernameInput.value.trim();
            if (enteredName) {
                currentUser.name = enteredName;
            }
            displayUsername.textContent = currentUser.name;
            userBadge.classList.remove('hidden');
            userBadge.classList.add('flex');
        }

        // Raum erstellen
        createRoomBtn.addEventListener('click', async () => {
            if (!isOnline) {
                showError("Keine Verbindung zur Cloud möglich.");
                return;
            }
            setupUser();
            const newRoomId = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            try {
                const roomRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', newRoomId);
                await setDoc(roomRef, {
                    content: '',
                    createdAt: serverTimestamp(),
                    host: currentUser.id
                });
                await enterRoom(newRoomId);
            } catch (err) {
                console.error(err);
                showError("Fehler beim Erstellen des Raumes.");
            }
        });

        // Raum beitreten
        joinRoomBtn.addEventListener('click', async () => {
            if (!isOnline) {
                showError("Keine Verbindung zur Cloud möglich.");
                return;
            }
            const roomId = roomIdInput.value.trim().toUpperCase();
            if (!roomId) {
                showError("Bitte gib einen Raum-Code ein.");
                return;
            }
            setupUser();

            try {
                const roomRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', roomId);
                const snap = await getDoc(roomRef);
                if (!snap.exists()) {
                    showError("Raum existiert nicht!");
                    return;
                }
                await enterRoom(roomId);
            } catch (err) {
                console.error(err);
                showError("Fehler beim Beitreten des Raumes.");
            }
        });

        async function enterRoom(roomId) {
            currentRoomId = roomId;
            currentRoomBadge.textContent = roomId;
            lobbyView.classList.add('hidden');
            editorView.classList.remove('hidden');

            const roomRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', roomId);
            
            // Text Live-Sync
            textUnsubscribe = onSnapshot(roomRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    if (!localChange && mainEditor.value !== data.content) {
                        mainEditor.value = data.content || '';
                    }
                    localChange = false;
                }
            });

            // Anwesenheit (Presence) Tracking
            const userPresenceRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', roomId, 'presence', currentUser.id);
            await setDoc(userPresenceRef, {
                name: currentUser.name,
                lastSeen: serverTimestamp()
            });

            const presenceCol = collection(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', roomId, 'presence');
            presenceUnsubscribe = onSnapshot(presenceCol, (snapshot) => {
                let users = [];
                snapshot.forEach(doc => users.push(doc.data()));
                activeUsersCount.textContent = users.length;
                activeUsersList.innerHTML = users.map(u => `
                    <div class="flex items-center space-x-2.5 p-2 bg-white rounded-xl border border-slate-200 shadow-xs">
                        <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                        <span class="text-xs font-medium text-slate-700 truncate">${escapeHtml(u.name)}</span>
                    </div>
                `).join('');
            });
        }

        // Textänderungen in Firestore speichern
        mainEditor.addEventListener('input', async () => {
            if (!currentRoomId || !isOnline) return;
            localChange = true;
            const roomRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', currentRoomId);
            try {
                await updateDoc(roomRef, {
                    content: mainEditor.value,
                    updatedAt: serverTimestamp()
                });
            } catch (e) {
                console.error("Fehler beim Speichern:", e);
            }
        });

        // Raum verlassen
        leaveRoomBtn.addEventListener('click', async () => {
            if (textUnsubscribe) textUnsubscribe();
            if (presenceUnsubscribe) presenceUnsubscribe();

            if (currentRoomId && isOnline) {
                try {
                    const userPresenceRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', currentRoomId, 'presence', currentUser.id);
                    await setDoc(userPresenceRef, { active: false });
                } catch(e) {}
            }

            currentRoomId = null;
            mainEditor.value = '';
            editorView.classList.add('hidden');
            lobbyView.classList.remove('hidden');
            roomIdInput.value = '';
        });

        clearTextBtn.addEventListener('click', async () => {
            if (confirm("Möchtest du den gesamten Text löschen?")) {
                mainEditor.value = '';
                if (currentRoomId && isOnline) {
                    const roomRef = doc(db, 'artifacts', 'live-text-collab-v1', 'public', 'rooms', currentRoomId);
                    await updateDoc(roomRef, { content: '' });
                }
            }
        });

        exportTxtBtn.addEventListener('click', () => {
            const blob = new Blob([mainEditor.value], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notiz-${currentRoomId || 'dokument'}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        });

        copyRoomBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentRoomId);
            copyRoomBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-600"></i>';
            setTimeout(() => { copyRoomBtn.innerHTML = '<i class="fa-regular fa-copy"></i>'; }, 1500);
        });

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
